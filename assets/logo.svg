<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="cg-grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cg-node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Outer hexagonal memory frame (with ~12% margin) -->
  <polygon points="64,14 107,39 107,89 64,114 21,89 21,39" stroke="url(#cg-grad)" stroke-width="5" stroke-linejoin="round" fill="rgba(99, 102, 241, 0.10)"/>
  <!-- Graph edges -->
  <line x1="64" y1="64" x2="64" y2="30" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="94" y2="47" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="94" y2="81" stroke="#C084FC" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="34" y2="81" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="34" y2="47" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="34" y1="47" x2="64" y2="30" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="94" y1="47" x2="94" y2="81" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="4 4"/>
  <!-- Outer nodes -->
  <circle cx="64" cy="30" r="7" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>
  <circle cx="94" cy="47" r="7" fill="#818CF8" stroke="#0F172A" stroke-width="2"/>
  <circle cx="94" cy="81" r="7" fill="#C084FC" stroke="#0F172A" stroke-width="2"/>
  <circle cx="34" cy="81" r="7" fill="#22D3EE" stroke="#0F172A" stroke-width="2"/>
  <circle cx="34" cy="47" r="7" fill="#818CF8" stroke="#0F172A" stroke-width="2"/>
  <!-- Center memory hub node -->
  <circle cx="64" cy="64" r="13" fill="url(#cg-node)" stroke="#F8FAFC" stroke-width="3"/>
  <circle cx="64" cy="64" r="5" fill="#F8FAFC"/>
</svg>
